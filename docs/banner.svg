<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1108"/>
      <stop offset="100%" stop-color="#141b0e"/>
    </linearGradient>
    <linearGradient id="accentFade" x1="460" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ab87a" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7ab87a"/>
      <stop offset="70%" stop-color="#7ab87a"/>
      <stop offset="100%" stop-color="#7ab87a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logoAccent" x1="0" y1="30" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ab87a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7ab87a" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.025" fill="white">
    <!-- Row 1 y=30 -->
    <circle cx="40"  cy="30" r="1.2"/><circle cx="100" cy="30" r="1.2"/><circle cx="160" cy="30" r="1.2"/>
    <circle cx="220" cy="30" r="1.2"/><circle cx="280" cy="30" r="1.2"/><circle cx="340" cy="30" r="1.2"/>
    <circle cx="860" cy="30" r="1.2"/><circle cx="920" cy="30" r="1.2"/><circle cx="980" cy="30" r="1.2"/>
    <circle cx="1040" cy="30" r="1.2"/><circle cx="1100" cy="30" r="1.2"/><circle cx="1160" cy="30" r="1.2"/>
    <!-- Row 2 y=80 -->
    <circle cx="40"  cy="80" r="1.2"/><circle cx="100" cy="80" r="1.2"/><circle cx="160" cy="80" r="1.2"/>
    <circle cx="220" cy="80" r="1.2"/><circle cx="280" cy="80" r="1.2"/><circle cx="340" cy="80" r="1.2"/>
    <circle cx="860" cy="80" r="1.2"/><circle cx="920" cy="80" r="1.2"/><circle cx="980" cy="80" r="1.2"/>
    <circle cx="1040" cy="80" r="1.2"/><circle cx="1100" cy="80" r="1.2"/><circle cx="1160" cy="80" r="1.2"/>
    <!-- Row 3 y=140 -->
    <circle cx="40"  cy="140" r="1.2"/><circle cx="100" cy="140" r="1.2"/><circle cx="160" cy="140" r="1.2"/>
    <circle cx="220" cy="140" r="1.2"/><circle cx="280" cy="140" r="1.2"/><circle cx="340" cy="140" r="1.2"/>
    <circle cx="860" cy="140" r="1.2"/><circle cx="920" cy="140" r="1.2"/><circle cx="980" cy="140" r="1.2"/>
    <circle cx="1040" cy="140" r="1.2"/><circle cx="1100" cy="140" r="1.2"/><circle cx="1160" cy="140" r="1.2"/>
    <!-- Row 4 y=190 -->
    <circle cx="40"  cy="190" r="1.2"/><circle cx="100" cy="190" r="1.2"/><circle cx="160" cy="190" r="1.2"/>
    <circle cx="220" cy="190" r="1.2"/><circle cx="280" cy="190" r="1.2"/><circle cx="340" cy="190" r="1.2"/>
    <circle cx="860" cy="190" r="1.2"/><circle cx="920" cy="190" r="1.2"/><circle cx="980" cy="190" r="1.2"/>
    <circle cx="1040" cy="190" r="1.2"/><circle cx="1100" cy="190" r="1.2"/><circle cx="1160" cy="190" r="1.2"/>
  </g>

  <!-- Decorative arc (echoes the fit score meter in the app) — right side -->
  <circle cx="1090" cy="110" r="68" stroke="rgba(122,184,122,0.055)" stroke-width="1.5" fill="none"/>
  <circle cx="1090" cy="110" r="52" stroke="rgba(122,184,122,0.04)" stroke-width="1" fill="none"/>
  <circle cx="1090" cy="110" r="36" stroke="rgba(122,184,122,0.03)" stroke-width="1" fill="none"/>
  <!-- Arc accent -->
  <path d="M 1090 42 A 68 68 0 0 1 1145 170" stroke="#7ab87a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.2"/>

  <!-- Logo mark — scaled up from Logo.jsx (original 28×28 → displayed at 64×64, centered at x=470, y=110) -->
  <!-- Outer rect: fill #1a1f16, rx=18 (scaled from 10) -->
  <rect x="456" y="78" width="64" height="64" rx="18" fill="#1a1f16"/>
  <!-- Border glow -->
  <rect x="456" y="78" width="64" height="64" rx="18" fill="none" stroke="rgba(122,184,122,0.15)" stroke-width="1"/>
  <!-- Trend polyline (scaled: original points 5,20 10,15 15,17 20,9 in 28×28 → multiply by 2.28) -->
  <!-- Mapped to rect starting at 456,78: x+=(456+5*2.28)=467.4, y+=(78+20*2.28)=123.6 -->
  <polyline
    points="467,122  479,111  489,115  501,96"
    stroke="rgba(255,255,255,0.82)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"/>
  <!-- Peak dot (original cx=20,cy=9,r=2.2 → scaled) -->
  <circle cx="501" cy="96" r="5" fill="#7ab87a" opacity="0.92"/>

  <!-- Title: PitchForge with exact navbar font weights -->
  <text
    x="540" y="122"
    font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="62"
    text-anchor="start"
    fill="rgba(255,255,255,0.95)"
    letter-spacing="-1.5">
    <tspan font-weight="600">Pitch</tspan><tspan font-weight="300">Forge</tspan>
  </text>

  <!-- Accent underline under title -->
  <rect x="540" y="131" width="196" height="2" rx="1" fill="url(#accentFade)"/>

  <!-- Subtitle -->
  <text
    x="540" y="158"
    font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    font-weight="400"
    text-anchor="start"
    letter-spacing="3"
    fill="rgba(122,184,122,0.45)">AI-POWERED FREELANCE PROPOSAL ENGINE</text>
</svg>
