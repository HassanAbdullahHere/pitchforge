name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  # ── Backend tests ─────────────────────────────────────────────────────────
  # Runs on its own VM. Spins up a real Postgres+pgvector container so
  # integration tests hit an actual database — no mocks.
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pitchforge
          POSTGRES_PASSWORD: pitchforge_dev
          POSTGRES_DB: pitchforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitchforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pgvector image ships with the extension but it must be explicitly enabled
      # per database. Base conftest.py uses Base.metadata.create_all (not Alembic),
      # so this is the only setup needed before pytest runs.
      - name: Enable pgvector extension
        run: psql postgresql://pitchforge:pitchforge_dev@localhost:5432/pitchforge_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # uv resolves pitchforge as a local path dep (../pitchforge) — works because
      # the full monorepo is checked out.
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --extra test

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -v

  # ── Frontend tests ────────────────────────────────────────────────────────
  # Runs on its own VM in parallel with test-backend.
  # No external services needed — vitest mocks all fetch calls.
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

  # ── Security scan ─────────────────────────────────────────────────────────
  # Runs on its own VM after both test jobs pass.
  # No secrets involved — safe to run on PRs too.
  # Rule: hard fail on CRITICAL/HIGH only, report and warn on everything else.
  security-scan:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Bandit (Python SAST) ───────────────────────────────────────────────
      - name: Install Bandit
        run: pip install bandit

      # Show all findings as a warning — never blocks the pipeline
      - name: Bandit report (all severities)
        run: bandit -r backend/app pitchforge/ -f text || true

      # Hard fail if any HIGH severity issue found (-lll = HIGH only)
      # Bandit's highest level is HIGH — this is our critical threshold
      - name: Bandit fail on HIGH severity
        run: bandit -r backend/app pitchforge/ -lll

      # ── npm audit (JS dependency CVEs) ────────────────────────────────────
      # Show all vulnerability levels as a warning
      - name: npm audit report (all severities)
        working-directory: frontend
        run: npm audit || true

      # Hard fail on critical CVEs only
      - name: npm audit fail on critical
        working-directory: frontend
        run: npm audit --audit-level=critical

      # ── Trivy (filesystem CVE scan — Python + JS deps) ────────────────────
      # Show HIGH, MEDIUM, LOW findings — never blocks
      - name: Trivy report (HIGH, MEDIUM, LOW)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,MEDIUM,LOW
          exit-code: '0'

      # Hard fail on CRITICAL CVEs only
      - name: Trivy fail on CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'

  # ── Deploy backend ────────────────────────────────────────────────────────
  # Only runs on push to main — never on PRs (secrets involved).
  # Builds Docker image, pushes to ECR, then tells EC2 via SSM to pull and restart.
  deploy-backend:
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # required for OIDC JWT generation
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Exchange GitHub JWT for short-lived AWS credentials — no static keys stored
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        run: |
          ECR_REGISTRY=623859664281.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE=$ECR_REGISTRY/pitchforge-backend:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      # SSM sends a shell script to EC2 without opening port 22.
      # EC2 agent picks it up, runs it, reports back exit code.
      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --region ap-south-1 \
            --parameters 'commands=[
              "docker stop backend || true",
              "docker rm backend || true",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 623859664281.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 623859664281.dkr.ecr.ap-south-1.amazonaws.com/pitchforge-backend:latest",
              "bash /home/ubuntu/run-backend.sh"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Block until the command finishes on EC2
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-south-1

          # Fetch result and fail the job if EC2 reported an error
          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-south-1 \
            --query 'StatusDetails' \
            --output text)

          echo "Deployment status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1

  # ── Deploy frontend ───────────────────────────────────────────────────────
  # Only runs after deploy-backend succeeds.
  # Polls /health until the new backend container is actually serving,
  # then builds and deploys via Vercel CLI — guaranteeing frontend never goes
  # live before backend is healthy.
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Poll /health every 10s for up to 5 minutes.
      # Waits for the new container to be serving, not just for SSM to finish.
      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            STATUS=$(curl -sf https://api.pitchforge.cloud/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then
              echo "Backend healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30 — not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Backend did not become healthy in time"
          exit 1

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel project settings and env vars
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
