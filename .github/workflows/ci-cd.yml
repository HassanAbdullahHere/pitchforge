name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  # ── Detect changed paths ──────────────────────────────────────────────────
  # Always runs first. Outputs two booleans that every downstream job reads
  # to decide whether to run or skip itself.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pitchforge/**'
              - 'Dockerfile'
              - '.dockerignore'
            frontend:
              - 'frontend/**'

  # ── Backend tests ─────────────────────────────────────────────────────────
  # Skipped entirely when only frontend files changed.
  test-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pitchforge
          POSTGRES_PASSWORD: pitchforge_dev
          POSTGRES_DB: pitchforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitchforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pgvector extension
        run: psql postgresql://pitchforge:pitchforge_dev@localhost:5432/pitchforge_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --extra test

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -v

  # ── Frontend tests ────────────────────────────────────────────────────────
  # Skipped entirely when only backend/pitchforge files changed.
  test-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

  # ── Security scan ─────────────────────────────────────────────────────────
  # Runs after whichever test jobs were triggered. Uses always() so a skipped
  # test job doesn't block it — but bails if a test job actually failed.
  security-scan:
    runs-on: ubuntu-latest
    needs: [changes, test-backend, test-frontend]
    if: |
      always() &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit report (all severities)
        run: bandit -r backend/app pitchforge/ -f text || true

      - name: Bandit fail on HIGH severity
        run: bandit -r backend/app pitchforge/ -lll

      - name: npm audit report (all severities)
        working-directory: frontend
        run: npm audit || true

      - name: npm audit fail on critical
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Trivy report (HIGH, MEDIUM, LOW)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Trivy fail on CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'

  # ── Deploy backend ────────────────────────────────────────────────────────
  # Only runs on main push when backend/pitchforge/Dockerfile changed.
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [changes, security-scan]
    if: |
      always() &&
      needs.security-scan.result == 'success' &&
      needs.changes.outputs.backend == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        run: |
          ECR_REGISTRY=623859664281.dkr.ecr.ap-south-1.amazonaws.com
          REPO=$ECR_REGISTRY/pitchforge-backend
          SHORT_SHA=${GITHUB_SHA::7}

          # Promote current latest → previous before overwriting (enables instant rollback)
          docker pull $REPO:latest && \
            docker tag $REPO:latest $REPO:previous && \
            docker push $REPO:previous || true

          # Build once, tag with immutable SHA + floating latest
          docker build -t $REPO:$SHORT_SHA -t $REPO:latest .
          docker push $REPO:$SHORT_SHA
          docker push $REPO:latest

          echo "Pushed $REPO:$SHORT_SHA and $REPO:latest"

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --region ap-south-1 \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 623859664281.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 623859664281.dkr.ecr.ap-south-1.amazonaws.com/pitchforge-backend:latest",
              "docker stop backend || true",
              "docker rm backend || true",
              "bash /home/ubuntu/run-backend.sh"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-south-1

          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-south-1 \
            --query 'StatusDetails' \
            --output text)

          echo "Deployment status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1

  # ── Deploy frontend ───────────────────────────────────────────────────────
  # Only runs when frontend files changed.
  # When both sides changed: waits for deploy-backend to finish first (ordering
  # preserved — frontend never goes live before the new backend is up).
  # When only frontend changed: deploy-backend was skipped, so this runs
  # immediately after security-scan without the health-poll wait.
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [changes, security-scan, deploy-backend]
    if: |
      always() &&
      needs.security-scan.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      needs.changes.outputs.frontend == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only needed when backend also deployed — skipped backend means no new
      # container to wait for. Check the deploy-backend result to decide.
      - name: Wait for backend health
        if: needs.deploy-backend.result == 'success'
        run: |
          for i in {1..30}; do
            STATUS=$(curl -sf https://api.pitchforge.cloud/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then
              echo "Backend healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30 — not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Backend did not become healthy in time"
          exit 1

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
