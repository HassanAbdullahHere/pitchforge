name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend tests ─────────────────────────────────────────────────────────
  # Runs on its own VM. Spins up a real Postgres+pgvector container so
  # integration tests hit an actual database — no mocks.
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pitchforge
          POSTGRES_PASSWORD: pitchforge_dev
          POSTGRES_DB: pitchforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitchforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pgvector image ships with the extension but it must be explicitly enabled
      # per database. Base conftest.py uses Base.metadata.create_all (not Alembic),
      # so this is the only setup needed before pytest runs.
      - name: Enable pgvector extension
        run: psql postgresql://pitchforge:pitchforge_dev@localhost:5432/pitchforge_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # uv resolves pitchforge as a local path dep (../pitchforge) — works because
      # the full monorepo is checked out.
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --extra test

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -v

  # ── Frontend tests ────────────────────────────────────────────────────────
  # Runs on its own VM in parallel with test-backend.
  # No external services needed — vitest mocks all fetch calls.
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

  # ── Security scan ─────────────────────────────────────────────────────────
  # Runs on its own VM after both test jobs pass.
  # No secrets involved — safe to run on PRs too.
  # Rule: hard fail on CRITICAL/HIGH only, report and warn on everything else.
  security-scan:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Bandit (Python SAST) ───────────────────────────────────────────────
      - name: Install Bandit
        run: pip install bandit

      # Show all findings as a warning — never blocks the pipeline
      - name: Bandit report (all severities)
        run: bandit -r backend/app pitchforge/ -f text || true

      # Hard fail if any HIGH severity issue found (-lll = HIGH only)
      # Bandit's highest level is HIGH — this is our critical threshold
      - name: Bandit fail on HIGH severity
        run: bandit -r backend/app pitchforge/ -lll

      # ── npm audit (JS dependency CVEs) ────────────────────────────────────
      # Show all vulnerability levels as a warning
      - name: npm audit report (all severities)
        working-directory: frontend
        run: npm audit || true

      # Hard fail on critical CVEs only
      - name: npm audit fail on critical
        working-directory: frontend
        run: npm audit --audit-level=critical

      # ── Trivy (filesystem CVE scan — Python + JS deps) ────────────────────
      # Show HIGH, MEDIUM, LOW findings — never blocks
      - name: Trivy report (HIGH, MEDIUM, LOW)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,MEDIUM,LOW
          exit-code: '0'

      # Hard fail on CRITICAL CVEs only
      - name: Trivy fail on CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
