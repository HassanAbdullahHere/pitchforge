[project]
name = "pitchforge-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pitchforge",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.0",
    "google-auth>=2.29.0",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.1.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv.sources]
pitchforge = { path = "../pitchforge", editable = true }
